name: Build and publish ARM64 add-on image

on:
  push:
    branches: [main]
    paths:
      - "max_inbox_qr_pilot/**"
      - ".github/workflows/build-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: max-inbox-qr-pilot-arm64
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read add-on version and validate architecture
        id: addon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("max_inbox_qr_pilot/config.yaml", encoding="utf-8") as file:
              config = json.load(file)
          assert config["arch"] == ["aarch64"], "Only aarch64 images are configured"
          version = config["version"]
          assert version and all(c.isalnum() or c in ".-_" for c in version)
          print(f"version={version}")
          PY

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./max_inbox_qr_pilot
          file: ./max_inbox_qr_pilot/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/rnztop/max_inbox_qr_pilot-aarch64:${{ steps.addon.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.addon.outputs.version }}
            BUILD_ARCH=aarch64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
