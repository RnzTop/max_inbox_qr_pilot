name: Test Python changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python modules
        run: python -m compileall -q max_inbox_qr_pilot
      - name: Run alert state tests
        run: python -m unittest discover -s max_inbox_qr_pilot/tests -v
